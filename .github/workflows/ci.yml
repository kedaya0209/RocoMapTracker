name: CI

on:
  push:
    branches:
      - master
      - 'dev-*'
  pull_request:
    branches:
      - master
  workflow_dispatch:

# 仅保留最新构建，取消队列中的旧任务
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  OPENCV_VERSION: 4.10.0

jobs:

  # ================================================================
  # JVM 编译 + 单元测试
  # ================================================================
  build-jvm:
    name: JVM Build & Test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup GraalVM JDK 25
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25'
          distribution: 'graalvm'
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache Maven repository
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Compile all modules
        run: mvn clean compile -pl roco-ui -am --no-transfer-progress

      - name: Run tests
        run: mvn test -pl roco-ui -am --no-transfer-progress

  # ================================================================
  # C++ 子进程编译（预编译 OpenCV + 快速 zlib）
  # ================================================================
  build-cpp:
    name: Build C++ Subprocesses
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Visual Studio (MSVC)
        uses: ilammy/msvc-dev-cmd@v1

      - name: Cache OpenCV
        id: cache-opencv
        uses: actions/cache@v4
        with:
          path: D:\a\opencv
          key: ${{ runner.os }}-opencv-${{ env.OPENCV_VERSION }}-v2

      - name: Download and extract pre-built OpenCV
        if: steps.cache-opencv.outputs.cache-hit != 'true'
        run: |
          curl.exe -L -o opencv.exe "https://github.com/opencv/opencv/releases/download/${{ env.OPENCV_VERSION }}/opencv-${{ env.OPENCV_VERSION }}-windows.exe"
          7z x opencv.exe -oD:\a\opencv -y > nul
        shell: cmd

      - name: Cache zlib
        id: cache-zlib
        uses: actions/cache@v4
        with:
          path: D:\a\zlib
          key: ${{ runner.os }}-zlib-1.3.1

      - name: Build pre-built zlib (official MSVC makefile, ~5s)
        if: steps.cache-zlib.outputs.cache-hit != 'true'
        run: |
          curl.exe -L -o v1.3.1.tar.gz "https://github.com/madler/zlib/archive/refs/tags/v1.3.1.tar.gz"
          tar -xzf v1.3.1.tar.gz
          cd zlib-1.3.1
          nmake /f win32/Makefile.msc
          if not exist zlib.lib exit /b 1
          mkdir D:\a\zlib\include D:\a\zlib\lib
          copy zlib.h D:\a\zlib\include\
          copy zconf.h D:\a\zlib\include\
          copy zlib.lib D:\a\zlib\lib\
          cd ..
        shell: cmd

      - name: Build capture.exe (DirectX only, no OpenCV)
        run: |
          cl /std:c++17 /O2 /EHsc /arch:AVX2 /Fe:capture.exe capture_main.cpp d3d11.lib dxgi.lib windowsapp.lib runtimeobject.lib user32.lib ws2_32.lib winmm.lib
        working-directory: cpp

      - name: Build sift_match.exe (with pre-built OpenCV)
        run: |
          set "INCLUDE=D:\a\opencv\opencv\build\include;D:\a\zlib\include;%INCLUDE%"
          set "LIB=D:\a\opencv\opencv\build\x64\vc16\lib;D:\a\zlib\lib;%LIB%"
          cl /std:c++17 /O2 /EHsc /arch:AVX2 /Fe:sift_match.exe sift_match_main.cpp ws2_32.lib opencv_world4100.lib
          copy /Y "D:\a\opencv\opencv\build\x64\vc16\bin\opencv_world4100.dll" .
        working-directory: cpp
        shell: cmd

      - name: Upload C++ artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cpp-binaries-${{ github.sha }}
          path: |
            cpp/capture.exe
            cpp/sift_match.exe
            cpp/opencv_world4100.dll
          compression-level: 0

  # ================================================================
  # Native Image 构建（仅 master 分支和手动触发）
  # ================================================================
  native-image:
    name: Native Image Build
    if: github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    needs:
      - build-jvm
      - build-cpp
    steps:
      - uses: actions/checkout@v4

      - name: Setup GraalVM JDK 25
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25'
          distribution: 'graalvm'
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache Maven repository
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Download C++ binaries
        uses: actions/download-artifact@v4
        with:
          name: cpp-binaries-${{ github.sha }}
          path: cpp

      - name: Copy C++ binaries to resource directories
        shell: cmd
        run: |
          copy /Y cpp\capture.exe roco-ui\src\main\resources\capture\RocoMapTracker-capture.exe
          copy /Y cpp\sift_match.exe roco-ui\src\main\resources\sift\RocoMapTracker-sift_match.exe
          copy /Y cpp\opencv_world4100.dll roco-ui\src\main\resources\sift\opencv_world4100.dll

      - name: Download private assets
        env:
          PAT_TOKEN: ${{ secrets.GH_PRIVATE_ASSETS_TOKEN }}
        run: |
          git clone https://x-access-token:%PAT_TOKEN%@github.com/tanghangliang/RocoMapTracker-resources.git private-assets
          if not exist roco-map\src\main\resources mkdir roco-map\src\main\resources
          xcopy /E /Y /I private-assets\resources roco-map\src\main\resources
        shell: cmd

      - name: Setup Visual Studio (MSVC)
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build Native Image
        run: mvn -Pnative clean package -pl roco-ui -am --no-transfer-progress

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: RocoMapTracker-${{ github.sha }}
          path: roco-ui/target/RocoMapTracker.exe
          compression-level: 0
