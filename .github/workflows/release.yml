name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release 版本号 (例如 1.2.0)'
        required: true
        type: string

env:
  OPENCV_VERSION: 4.10.0

jobs:

  # ================================================================
  # C++ 子进程编译
  # ================================================================
  build-cpp:
    name: Build C++ Subprocesses
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Visual Studio (MSVC)
        uses: ilammy/msvc-dev-cmd@v1

      - name: Cache OpenCV (built from source)
        id: cache-opencv
        uses: actions/cache@v4
        with:
          path: D:\a\opencv-install
          key: ${{ runner.os }}-opencv-src-${{ env.OPENCV_VERSION }}-core-imgproc-features2d-flann-calib3d-noipp-v1

      - name: Build OpenCV from source
        if: steps.cache-opencv.outputs.cache-hit != 'true'
        run: |
          curl.exe -L -o opencv.zip "https://github.com/opencv/opencv/archive/refs/tags/${{ env.OPENCV_VERSION }}.zip"
          powershell -Command "Expand-Archive -Path 'opencv.zip' -DestinationPath '.' -Force"
          mkdir opencv-${{ env.OPENCV_VERSION }}\build
          pushd opencv-${{ env.OPENCV_VERSION }}\build
          cmake -G "NMake Makefiles" -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=D:\a\opencv-install -DBUILD_SHARED_LIBS=ON -DBUILD_LIST=core,imgproc,features2d,flann,calib3d -DBUILD_opencv_python2=OFF -DBUILD_opencv_python3=OFF -DBUILD_TESTS=OFF -DBUILD_PERF_TESTS=OFF -DBUILD_EXAMPLES=OFF -DBUILD_DOCS=OFF -DBUILD_opencv_apps=OFF -DWITH_FFMPEG=OFF -DWITH_GTK=OFF -DWITH_V4L=OFF -DWITH_CUDA=OFF -DWITH_OPENCL=OFF -DWITH_QUIRC=OFF -DWITH_IPP=OFF -DBUILD_PNG=OFF -DBUILD_JPEG=OFF -DBUILD_TIFF=OFF -DBUILD_WEBP=OFF -DBUILD_OPENJPEG=OFF -DBUILD_ZLIB=OFF ..
          nmake /NOLOGO
          nmake install
          popd
          dir D:\a\opencv-install\x64\vc17\lib\*.lib
        shell: cmd

      - name: Cache zlib
        id: cache-zlib
        uses: actions/cache@v4
        with:
          path: D:\a\zlib
          key: ${{ runner.os }}-zlib-1.3.1

      - name: Build pre-built zlib
        if: steps.cache-zlib.outputs.cache-hit != 'true'
        run: |
          curl.exe -L -o v1.3.1.tar.gz "https://github.com/madler/zlib/archive/refs/tags/v1.3.1.tar.gz"
          tar -xzf v1.3.1.tar.gz
          cd zlib-1.3.1
          nmake /f win32/Makefile.msc
          if not exist zlib.lib exit /b 1
          mkdir D:\a\zlib\include D:\a\zlib\lib
          copy zlib.h D:\a\zlib\include\
          copy zconf.h D:\a\zlib\include\
          copy zlib.lib D:\a\zlib\lib\
          cd ..
        shell: cmd

      - name: Build capture.exe
        run: |
          rc /nologo /fo resource.res resource.rc
          cl /std:c++17 /O2 /EHsc /arch:AVX2 /Fe:capture.exe capture_main.cpp resource.res d3d11.lib dxgi.lib windowsapp.lib runtimeobject.lib user32.lib ws2_32.lib winmm.lib
        working-directory: cpp

      - name: Build match.exe (with source-built OpenCV)
        run: |
          set "INCLUDE=D:\a\opencv-install\include;D:\a\zlib\include;%INCLUDE%"
          set "LIB=D:\a\opencv-install\x64\vc17\lib;D:\a\zlib\lib;%LIB%"
          rc /nologo /fo resource.res resource.rc
          cl /std:c++17 /O2 /EHsc /arch:AVX2 /I"D:\a\opencv-install\include" /I"D:\a\zlib\include" /Fe:RocoMapTracker-match.exe match_main.cpp sift_matcher.cpp match_common.cpp resource.res /link /OPT:REF /LIBPATH:"D:\a\opencv-install\x64\vc17\lib" /LIBPATH:"D:\a\zlib\lib" ws2_32.lib opencv_core4100.lib opencv_imgproc4100.lib opencv_features2d4100.lib opencv_flann4100.lib opencv_calib3d4100.lib zlib.lib
          for %%D in (core imgproc features2d flann calib3d) do copy /Y "D:\a\opencv-install\x64\vc17\bin\opencv_%%D4100.dll" .
        working-directory: cpp
        shell: cmd

      - name: Upload C++ artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cpp-binaries
          path: |
            cpp/capture.exe
            cpp/RocoMapTracker-match.exe
            cpp/opencv_core4100.dll
            cpp/opencv_imgproc4100.dll
            cpp/opencv_features2d4100.dll
            cpp/opencv_flann4100.dll
            cpp/opencv_calib3d4100.dll
          compression-level: 0

  # ================================================================
  # Native Image 构建 + Release
  # ================================================================
  release:
    name: Build & Release
    runs-on: windows-latest
    needs: build-cpp
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Liberica NIK JDK 25
        shell: pwsh
        run: |
          $tag = "25.0.3+1-25.0.3+12"
          $cacheDir = Join-Path $env:RUNNER_TOOL_CACHE "liberica-nik" "25.0.3+1-25.0.3+12"
          $javaHome = $null
          if (Test-Path $cacheDir) {
            $dirs = Get-ChildItem -Path $cacheDir -Directory | Where-Object { $_.Name -like "*liberica*" }
            if ($dirs) { $javaHome = $dirs[0].FullName }
          }
          if (-not $javaHome) {
            Write-Host "Downloading Liberica NIK (full)..."
            $url = "https://github.com/bell-sw/LibericaNIK/releases/download/${tag}/bellsoft-liberica-vm-full-openjdk25.0.3%2B12-25.0.3%2B1-windows-amd64.zip"
            New-Item -ItemType Directory -Path $cacheDir -Force | Out-Null
            Invoke-WebRequest -Uri $url -OutFile "$cacheDir\nik.zip"
            Expand-Archive -Path "$cacheDir\nik.zip" -DestinationPath $cacheDir -Force
            Remove-Item "$cacheDir\nik.zip"
            $dirs = Get-ChildItem -Path $cacheDir -Directory | Where-Object { $_.Name -like "*liberica*" }
            if (-not $dirs) { Write-Error "Failed to find extracted JDK directory"; exit 1 }
            $javaHome = $dirs[0].FullName
          }
          Write-Host "JAVA_HOME=$javaHome"
          "JAVA_HOME=$javaHome" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "GRAALVM_HOME=$javaHome" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          echo "$javaHome\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Cache Maven repository
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Download C++ binaries
        uses: actions/download-artifact@v4
        with:
          name: cpp-binaries
          path: cpp

      - name: Copy C++ binaries to resource directories
        shell: cmd
        run: |
          copy /Y cpp\capture.exe roco-ui\src\main\resources\capture\RocoMapTracker-capture.exe
          copy /Y cpp\RocoMapTracker-match.exe roco-ui\src\main\resources\match\RocoMapTracker-match.exe
          for %%D in (core imgproc features2d flann calib3d) do copy /Y cpp\opencv_%%D4100.dll roco-ui\src\main\resources\match\opencv_%%D4100.dll

      - name: Download private assets
        env:
          PAT_TOKEN: ${{ secrets.GH_PRIVATE_ASSETS_TOKEN }}
        run: |
          git clone https://x-access-token:%PAT_TOKEN%@github.com/tanghangliang/RocoMapTracker-resources.git private-assets
          if not exist roco-map\src\main\resources mkdir roco-map\src\main\resources
          xcopy /E /Y /I private-assets\resources roco-map\src\main\resources
        shell: cmd

      - name: Setup Visual Studio (MSVC)
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build Native Image
        run: mvn -Pnative clean verify -pl roco-ui -am --no-transfer-progress "-Dapp.version=${{ github.event.inputs.version }}"

      - name: Get previous release tag
        id: prev_tag
        continue-on-error: true
        shell: bash
        run: |
          # fetch 远端 tags 到本地
          git fetch origin --tags --force 2>/dev/null || true
          # 从本地 tags 查询上一个版本
          PREV_TAG=$(git tag -l 'v*' | sort -V | grep -v -x "v${{ github.event.inputs.version }}" | tail -1)
          echo "prev_tag=$PREV_TAG" >> "$GITHUB_OUTPUT"

      - name: Download previous EXE from previous Release
        continue-on-error: true
        shell: bash
        run: |
          PREV_TAG="${{ steps.prev_tag.outputs.prev_tag }}"
          if [ -n "$PREV_TAG" ]; then
            echo "Downloading previous exe from $PREV_TAG ..."
            gh release download "$PREV_TAG" --pattern "RocoMapTracker.exe" --repo kedaya0209/RocoMapTracker --skip-existing 2>/dev/null || echo "No exe asset found in $PREV_TAG"
          else
            echo "No previous release tag found, skipping"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate HDiffPatch
        run: |
          set "PREV_TAG=${{ steps.prev_tag.outputs.prev_tag }}"
          if "%PREV_TAG%"=="" set "PREV_TAG=v${{ github.event.inputs.version }}"
          curl -L -o hdiffpatch.zip "https://github.com/sisong/HDiffPatch/releases/download/v4.12.2/hdiffpatch_v4.12.2_bin_windows64.zip"
          7z e hdiffpatch.zip -y > nul
          if exist RocoMapTracker.exe (
            echo Generating HDiffPatch ...
            hdiffz.exe RocoMapTracker.exe roco-ui\target\RocoMapTracker.exe RocoMapTracker-%PREV_TAG%-to-v${{ github.event.inputs.version }}.hdiff
          ) else (
            echo No previous exe found, skipping HDiffPatch
          )
        shell: cmd

      - name: Generate SHA256 checksums
        shell: cmd
        run: |
          powershell -Command "(Get-FileHash 'roco-ui\target\RocoMapTracker.exe' -Algorithm SHA256).Hash.ToLower() | Set-Content 'RocoMapTracker.exe.sha256' -Encoding ASCII"
          if exist RocoMapTracker-*.hdiff (
            for %%f in (RocoMapTracker-*.hdiff) do (
              powershell -Command "(Get-FileHash '%%f' -Algorithm SHA256).Hash.ToLower() | Set-Content '%%f.sha256' -Encoding ASCII"
            )
          )

      - name: Push HDiffPatch to patches branch for jsDelivr CDN
        if: hashFiles('RocoMapTracker-*.hdiff') != ''
        continue-on-error: true
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          ORIG_REF=$(git rev-parse HEAD)

          # 孤儿分支，只包含最新 .hdiff，无历史积累
          git checkout --orphan patches_tmp
          git rm -rf . 2>/dev/null || true

          mkdir -p updates
          for f in RocoMapTracker-*.hdiff*; do
            [ -f "$f" ] && cp "$f" "updates/$f"
          done

          git add updates/
          git commit -m "chore: add patches for v${{ github.event.inputs.version }} [skip ci]"

          # 强制推送 patches 分支
          git push origin HEAD:patches --force

          # 恢复原始工作树（即使 push 失败也要恢复）
          git checkout -f "$ORIG_REF" 2>/dev/null || true

      - name: Purge jsDelivr CDN cache
        if: hashFiles('RocoMapTracker-*.hdiff') != ''
        continue-on-error: true
        shell: bash
        run: |
          for f in RocoMapTracker-*.hdiff*; do
            [ -f "$f" ] && curl -sS -o /dev/null "https://purge.jsdelivr.net/gh/kedaya0209/RocoMapTracker@patches/updates/$f"
          done

      - name: Cleanup existing release and tag
        continue-on-error: true
        shell: bash
        run: |
          echo "Cleaning up any existing v${{ github.event.inputs.version }} release and tag ..."
          gh release delete "v${{ github.event.inputs.version }}" --yes 2>/dev/null || true
          git push --delete origin "v${{ github.event.inputs.version }}" 2>/dev/null || true

      - name: Generate release notes
        shell: bash
        run: |
          PREV_TAG="${{ steps.prev_tag.outputs.prev_tag }}"
          if [ -z "$PREV_TAG" ]; then
            echo "首次发版，使用全部 commit 日志" >&2
            git log --no-merges --oneline --format="- %s" > releasenotes.md
          else
            echo "生成从 $PREV_TAG 到 HEAD 的 release notes" >&2
            git log "$PREV_TAG..HEAD" --no-merges --oneline --format="- %s" > releasenotes.md 2>/dev/null || {
              echo "无法使用 $PREV_TAG 生成日志，使用全部 commit" >&2
              git log --no-merges --oneline --format="- %s" > releasenotes.md
            }
          fi
          echo "" >> releasenotes.md
          echo "**SHA256**: 见附件 \`.sha256\` 文件" >> releasenotes.md

      - name: Create GitHub Release
        shell: cmd
        run: |
          set "PREV_TAG=${{ steps.prev_tag.outputs.prev_tag }}"
          if "%PREV_TAG%"=="" set "PREV_TAG=v${{ github.event.inputs.version }}"
          echo Creating release v${{ github.event.inputs.version }} ...
          set "PATCH_FILE=RocoMapTracker-%PREV_TAG%-to-v${{ github.event.inputs.version }}.hdiff"
          if not exist "%PATCH_FILE%" set "PATCH_FILE="
          set "PATCH_SHA256=%PATCH_FILE%.sha256"
          if not exist "%PATCH_SHA256%" set "PATCH_SHA256="
          gh release create v${{ github.event.inputs.version }} ^
            roco-ui\target\RocoMapTracker.exe ^
            RocoMapTracker.exe.sha256 ^
            %PATCH_FILE% ^
            %PATCH_SHA256% ^
            --title "v${{ github.event.inputs.version }}" ^
            --notes-file releasenotes.md ^
            --repo kedaya0209/RocoMapTracker
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
